name: DFP Command frontend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: |
          node --test tests/*.test.mjs supabase/tests/quickguard_reply_branding.mjs
          python3 tests/test_hal_task_writer.py
      - name: Production build
        run: npm run build
